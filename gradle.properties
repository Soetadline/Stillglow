# =======================================================================
#  Stillglow — gradle.properties
# =======================================================================
#  IMPORTANT — read before building:
#  Minecraft 26.3 is a very recent (Q3 2026) game drop. The exact Yarn
#  mapping build number below may be a patch or two behind by the time
#  you build. If Gradle can't resolve `yarn_mappings`, go to
#  https://fabricmc.net/develop/  , pick "26.3" from the Minecraft
#  version dropdown, and paste in the mappings/loader/API versions it
#  gives you. Everything else in this file will keep working unchanged.
# =======================================================================

# Toolchain
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft / mappings / loader — verify against fabricmc.net/develop
minecraft_version=26.3
yarn_mappings=26.3+build.1
loader_version=0.16.10

# Mod version info
mod_version=1.0.0
maven_group=com.soetadline
archives_base_name=stillglow

# Dependencies — verify latest compatible builds at:
#   Fabric API:    https://modrinth.com/mod/fabric-api/versions?g=26.3
#   Cloth Config:  https://modrinth.com/mod/cloth-config/versions?g=26.3
#   Mod Menu:      https://modrinth.com/mod/modmenu/versions?g=26.3
fabric_version=0.110.0+26.3
cloth_config_version=15.0.140
mod_menu_version=11.0.3
