plugins {
	id 'net.fabricmc.fabric-loom' version '1.18.2'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Cloth Config / Mod Menu are published here
	maven { url = "https://maven.shedaniel.me/" }
	maven { url = "https://maven.terraformersmc.com/releases/" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"stillglow" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// Minecraft is shipped unobfuscated in 26.3; no mappings dependency is needed.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API — required. Provides tick events, particle/entity helpers,
	// networking and rendering hooks used throughout this mod.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	clientImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Cloth Config API — required by the in-game menu (see README "Libraries used").
	implementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
	clientImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

	// Mod Menu — optional. Lets Stillglow's config screen show up under
	// the vanilla "Mods" button. The mod works fine without it (see
	// StillglowClient for the fallback keybind), it just won't appear
	// in the Mod Menu list.
	implementation "com.terraformersmc:modmenu:${project.mod_menu_version}"
	clientImplementation "com.terraformersmc:modmenu:${project.mod_menu_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
